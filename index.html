<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Tu opinión sobre Buda</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <main class="form-shell">
    <div class="brand">Buda.com <span>· Encuesta</span></div>
    <div class="progress" aria-hidden="true"><div id="bar"></div></div>
    <div class="step-label" id="stepLabel"></div>
    <form id="form" class="card" novalidate>
      <div id="stepHost"></div>
      <div class="hp" aria-hidden="true"><label>Sitio web <input type="text" name="website" tabindex="-1" autocomplete="off"></label></div>
      <div class="error" id="error" role="alert"></div>
      <div class="actions">
        <button type="button" class="btn" id="back">Atrás</button>
        <button type="submit" class="btn primary" id="next">Siguiente</button>
      </div>
    </form>
    <section class="card done" id="done" hidden>
      <div class="check" aria-hidden="true">✓</div>
      <h1>¡Gracias!</h1>
      <p class="lead">Tus respuestas llegan directo al equipo que define el producto de Buda.</p>
    </section>
  </main>
  <script src="/questions.js"></script>
  <script src="/form.js"></script>
</body>
</html>
