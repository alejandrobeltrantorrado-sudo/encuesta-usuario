<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Dashboard · Premium inactivos</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/styles.css">
  <style>
    :root { --seq-100:#cde2fb; --seq-200:#9ec5f4; --seq-300:#6da7ec; --seq-400:#3987e5; --seq-500:#256abf; --seq-600:#184f95; --seq-700:#0d366b; --track: #ecebe7; --grid: #e2e1dc; }
    @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --track: #2a2a28; --grid: #383835; } }
    :root[data-theme="dark"] { --track: #2a2a28; --grid: #383835; }

    .dash { max-width: 1240px; margin: 0 auto; padding: 20px 16px 64px; }
    .topbar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 16px; }
    .topbar h1 { font-size: 20px; margin: 0; letter-spacing: -0.01em; }
    .topbar .sub { color: var(--text-3); font-size: 13px; }
    .live { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--text-2); }
    .live .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--good); box-shadow: 0 0 0 0 color-mix(in srgb, var(--good) 50%, transparent); animation: pulse 2s infinite; }
    .live.off .dot { background: var(--critical); animation: none; }
    @keyframes pulse { 0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--good) 45%, transparent); } 70% { box-shadow: 0 0 0 7px transparent; } 100% { box-shadow: 0 0 0 0 transparent; } }
    .top-actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

    .banner { border-radius: 8px; padding: 10px 14px; margin-bottom: 12px; font-size: 14px; background: var(--warning-bg); color: var(--warning-text); }
    .banner.critical { background: color-mix(in srgb, var(--critical) 14%, var(--surface)); color: var(--text); border: 1px solid var(--critical); }
    .banner strong { font-weight: 700; }

    .filters { display: flex; flex-wrap: wrap; gap: 10px; align-items: end; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 12px; margin-bottom: 16px; }
    .filters label { display: grid; gap: 4px; font-size: 12px; color: var(--text-3); font-weight: 500; }
    .filters select, .filters input[type=date] { padding: 7px 10px; border: 1px solid var(--border); border-radius: 7px; background: var(--surface); min-width: 150px; font-size: 14px; color: var(--text); }
    .filters .count { margin-left: auto; font-size: 13px; color: var(--text-2); align-self: center; }

    .tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--border); margin-bottom: 16px; overflow-x: auto; }
    .tab { appearance: none; background: none; border: 0; border-bottom: 2px solid transparent; padding: 10px 14px; cursor: pointer; font-weight: 600; color: var(--text-3); white-space: nowrap; }
    .tab[aria-selected="true"] { color: var(--text); border-bottom-color: var(--accent); }
    .tab .badge { display: inline-block; min-width: 18px; padding: 0 6px; border-radius: 9px; background: var(--surface-2); color: var(--text-2); font-size: 12px; margin-left: 4px; }

    .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; margin-bottom: 16px; }
    .kpi { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 16px; }
    .kpi .k-label { font-size: 13px; color: var(--text-2); }
    .kpi .k-value { font-size: 30px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.15; margin: 6px 0 2px; font-variant-numeric: tabular-nums; }
    .kpi .k-value.text { font-size: 19px; line-height: 1.25; }
    .kpi .k-foot { font-size: 12px; color: var(--text-3); }

    .grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
    .grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
    @media (max-width: 900px) { .grid2, .grid3 { grid-template-columns: minmax(0, 1fr); } }
    .panel { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; margin-bottom: 16px; min-width: 0; }
    .grid2 .panel, .grid3 .panel { margin-bottom: 0; }
    .grid2, .grid3 { margin-bottom: 16px; }
    .panel h2 { font-size: 15px; margin: 0 0 2px; }
    .panel .p-sub { font-size: 12px; color: var(--text-3); margin: 0 0 14px; }

    /* barras horizontales */
    .bars { display: grid; gap: 8px; }
    .bar-row { display: grid; grid-template-columns: minmax(110px, 38%) 1fr 86px; gap: 10px; align-items: center; font-size: 13px; }
    .bar-row .bl { color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .bar-track { position: relative; height: 18px; background: var(--track); border-radius: 0 4px 4px 0; }
    .bar-fill { position: absolute; inset: 0 auto 0 0; background: var(--accent); border-radius: 0 4px 4px 0; min-width: 2px; transition: width .4s ease; }
    .bar-row .bv { text-align: right; font-variant-numeric: tabular-nums; color: var(--text); }
    .bar-row .bv small { color: var(--text-3); margin-left: 4px; }
    .bar-row:hover .bar-fill { background: var(--accent-strong); }
    .empty { color: var(--text-3); font-size: 13px; padding: 12px 0; }

    /* tablas */
    .tbl-wrap { overflow-x: auto; }
    table.tbl { width: 100%; border-collapse: collapse; font-size: 13px; font-variant-numeric: tabular-nums; }
    .tbl th { text-align: right; font-weight: 600; color: var(--text-2); padding: 8px 10px; border-bottom: 1px solid var(--border); white-space: nowrap; vertical-align: bottom; }
    .tbl th:first-child, .tbl td:first-child { text-align: left; }
    .tbl td { text-align: right; padding: 8px 10px; border-bottom: 1px solid var(--grid); }
    .tbl tr:hover td { background: color-mix(in srgb, var(--accent) 5%, transparent); }
    .tbl .muted { color: var(--text-3); }
    .tbl .hl { font-weight: 700; }
    .tbl th .th-sub { display: block; font-weight: 400; color: var(--text-3); font-size: 11px; }

    /* mapa de calor */
    .heat th { white-space: normal; min-width: 90px; max-width: 160px; }
    .heat th:first-child { min-width: 170px; }
    .heat td.cell { text-align: center; min-width: 64px; border: 2px solid var(--surface); border-radius: 4px; }
    .heat td.cell.low { background-image: repeating-linear-gradient(45deg, transparent 0 4px, color-mix(in srgb, var(--text-3) 22%, transparent) 4px 5px); }
    .legend-row { display: flex; gap: 14px; flex-wrap: wrap; align-items: center; font-size: 12px; color: var(--text-3); margin-top: 10px; }
    .legend-ramp { display: inline-flex; border-radius: 3px; overflow: hidden; }
    .legend-ramp span { width: 22px; height: 10px; }
    .swatch-low { display: inline-block; width: 22px; height: 10px; border-radius: 2px; background-image: repeating-linear-gradient(45deg, transparent 0 4px, color-mix(in srgb, var(--text-3) 40%, transparent) 4px 5px); border: 1px solid var(--border); }

    /* codificación */
    .code-tools { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 12px; }
    .code-tools input[type=search] { padding: 8px 12px; border: 1px solid var(--border); border-radius: 7px; background: var(--surface); min-width: 240px; flex: 1; }
    .seg { display: inline-flex; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
    .seg button { appearance: none; border: 0; background: var(--surface); padding: 7px 12px; cursor: pointer; font-size: 13px; color: var(--text-2); }
    .seg button[aria-pressed="true"] { background: var(--surface-2); color: var(--text); font-weight: 600; }
    .resp { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 16px; margin-bottom: 10px; }
    .resp-head { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; font-size: 12px; color: var(--text-3); margin-bottom: 8px; }
    .pill { display: inline-block; padding: 2px 8px; border-radius: 10px; background: var(--surface-2); color: var(--text-2); font-size: 12px; }
    .pill.ok { background: color-mix(in srgb, var(--good) 16%, var(--surface)); color: var(--text); }
    .pill.pending { background: var(--warning-bg); color: var(--warning-text); }
    .resp-text { font-size: 15px; margin: 0 0 10px; white-space: pre-wrap; overflow-wrap: anywhere; }
    .resp-text.empty-text { color: var(--text-3); font-style: italic; }
    .chips { display: flex; flex-wrap: wrap; gap: 6px; }
    .chip { appearance: none; border: 1px solid var(--border); background: var(--surface); border-radius: 14px; padding: 4px 10px; font-size: 12px; cursor: pointer; color: var(--text-2); }
    .chip:hover { border-color: var(--accent); }
    .chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
    .chip.suggested:not([aria-pressed="true"]) { border-style: dashed; border-color: var(--accent); color: var(--text); }
    .resp-extra { margin-top: 10px; font-size: 13px; color: var(--text-2); display: grid; gap: 4px; }
    .resp-extra b { color: var(--text); font-weight: 600; }
    .resp-foot { display: flex; justify-content: space-between; gap: 8px; margin-top: 10px; align-items: center; flex-wrap: wrap; }
    .linkbtn { appearance: none; border: 0; background: none; padding: 0; color: var(--text-3); font-size: 12px; cursor: pointer; text-decoration: underline; }
    .linkbtn:hover { color: var(--critical); }

    .tip { position: fixed; z-index: 50; pointer-events: none; background: var(--text); color: var(--bg); font-size: 12px; padding: 6px 9px; border-radius: 6px; max-width: 280px; line-height: 1.4; opacity: 0; transition: opacity .1s; }
    .tip.show { opacity: 1; }
    .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: var(--text); color: var(--bg); padding: 9px 14px; border-radius: 8px; font-size: 13px; opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 60; }
    .toast.show { opacity: 1; }
    .method { font-size: 13px; color: var(--text-2); }
    .method li { margin-bottom: 6px; }
  </style>
</head>
<body>
  <div class="dash">
    <header class="topbar">
      <div>
        <h1>Usuarios premium inactivos</h1>
        <div class="sub">Causas de abandono y potencial de recuperación</div>
      </div>
      <div class="top-actions">
        <span class="live" id="live"><span class="dot"></span><span id="liveText">Conectando…</span></span>
        <button class="btn sm" id="copyLink" type="button">Copiar enlace de la encuesta</button>
        <a class="btn sm" id="exportCsv" href="/api/admin/export.csv">Exportar CSV</a>
      </div>
    </header>

    <div id="banners"></div>

    <section class="filters" aria-label="Filtros">
      <label>Uso principal <select id="fP2"></select></label>
      <label>Frecuencia <select id="fP3"></select></label>
      <label>Antigüedad <select id="fP1"></select></label>
      <label>Pagos a terceros <select id="fP8"></select></label>
      <label>Desde <input type="date" id="fFrom"></label>
      <label>Hasta <input type="date" id="fTo"></label>
      <button class="btn sm" id="fClear" type="button">Limpiar</button>
      <span class="count" id="fCount"></span>
    </section>

    <nav class="tabs" role="tablist">
      <button class="tab" role="tab" data-tab="resumen" aria-selected="true">Resumen</button>
      <button class="tab" role="tab" data-tab="cruces" aria-selected="false">Cruces</button>
      <button class="tab" role="tab" data-tab="codificar" aria-selected="false">Respuestas abiertas <span class="badge" id="pendBadge">0</span></button>
      <button class="tab" role="tab" data-tab="metodo" aria-selected="false">Metodología</button>
    </nav>

    <main id="view"></main>
  </div>
  <div class="tip" id="tip" role="tooltip"></div>
  <div class="toast" id="toast" role="status"></div>
  <script src="/questions.js"></script>
  <script src="/dashboard.js"></script>
</body>
</html>
